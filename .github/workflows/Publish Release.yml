name: Publish Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - .github/workflows/*

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get version from plugin.json
        id: version
        uses: notiz-dev/github-action-json-property@release
        with:
          path: 'plugin.json'
          prop_path: 'Version'

      - name: Display version
        run: echo "Version ${{ steps.version.outputs.prop }}"

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install flowlauncher PyYAML -t ./lib
          zip -r Flow.Launcher.Plugin.GoogleTranslate.zip . -x '*.git*'

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: 'Flow.Launcher.Plugin.GoogleTranslate.zip'
          tag_name: "v${{ steps.version.outputs.prop }}"
          generate_release_notes: true
